syntax = "proto3";

package userauth.v1;

option go_package = "github.com/haunted-saas/user-auth-service/proto/userauth/v1;userauthv1";

import "google/protobuf/timestamp.proto";

service UserAuthService {
  // Authentication
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  
  // Password Management
  rpc RequestPasswordReset(PasswordResetRequest) returns (PasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  
  // User Management
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  
  // RBAC Management
  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc UpdateRole(UpdateRoleRequest) returns (Role);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc AssignRoleToUser(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RevokeRoleFromUser(RevokeRoleRequest) returns (RevokeRoleResponse);
  
  // Authorization
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GetUserPermissions(GetUserPermissionsRequest) returns (GetUserPermissionsResponse);
  
  // Team Management
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  rpc UpdateTeam(UpdateTeamRequest) returns (UpdateTeamResponse);
  rpc InviteTeamMember(InviteTeamMemberRequest) returns (InviteTeamMemberResponse);
  rpc AcceptTeamInvitation(AcceptTeamInvitationRequest) returns (AcceptTeamInvitationResponse);
  rpc ListTeamMembers(ListTeamMembersRequest) returns (ListTeamMembersResponse);
}

// Authentication Messages
message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string signup_type = 4; // 'owner' or 'member'
  string team_id = 5; // Required if signup_type is 'member'
  string invitation_token = 6; // Optional invitation token
}

message RegisterResponse {
  User user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string ip_address = 3;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message LogoutRequest {
  string session_token = 1;
  bool all_devices = 2;
}

message LogoutResponse {
  bool success = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string team_id = 3;
  repeated string roles = 4;
  repeated string permissions = 5;
  User user = 6;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message RefreshSessionResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Password Management Messages
message PasswordResetRequest {
  string email = 1;
}

message PasswordResetResponse {
  bool success = 1;
  string message = 2;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool success = 1;
}

// User Management Messages
message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message ListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total_count = 2;
}

message UpdateUserRequest {
  string user_id = 1;
  string name = 2;
  string email = 3;
}

message UpdateUserResponse {
  User user = 1;
}

// RBAC Messages
message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated string permission_ids = 3;
}

message UpdateRoleRequest {
  string role_id = 1;
  string name = 2;
  string description = 3;
  repeated string permission_ids = 4;
}

message DeleteRoleRequest {
  string role_id = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}

message GetRoleRequest {
  string role_id = 1;
}

message GetRoleResponse {
  Role role = 1;
}

message ListRolesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListRolesResponse {
  repeated Role roles = 1;
  int32 total_count = 2;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message AssignRoleResponse {
  bool success = 1;
}

message RevokeRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message RevokeRoleResponse {
  bool success = 1;
}

message CheckPermissionRequest {
  string user_id = 1;
  string permission = 2;
  string session_token = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string reason = 2;
}

message GetUserPermissionsRequest {
  string user_id = 1;
}

message GetUserPermissionsResponse {
  repeated string permissions = 1;
}

// Domain Models
message User {
  string id = 1;
  string email = 2;
  string name = 3;
  bool is_active = 4;
  bool is_locked = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated Role roles = 8;
  string team_id = 9;
  string signup_type = 10;
}

message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_system = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  repeated Permission permissions = 7;
}

message Permission {
  string id = 1;
  string name = 2;
  string resource = 3;
  string action = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Team Management Messages
message Team {
  string id = 1;
  string name = 2;
  string slug = 3;
  string owner_id = 4;
  bool is_multi_tenant = 5;
  string tenant_mode = 6;
  int32 max_members = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateTeamRequest {
  string name = 1;
  string slug = 2;
  string owner_id = 3;
  bool is_multi_tenant = 4;
  string tenant_mode = 5;
}

message CreateTeamResponse {
  Team team = 1;
}

message GetTeamRequest {
  string team_id = 1;
}

message GetTeamResponse {
  Team team = 1;
}

message UpdateTeamRequest {
  string team_id = 1;
  string name = 2;
  bool is_multi_tenant = 3;
  string tenant_mode = 4;
}

message UpdateTeamResponse {
  Team team = 1;
}

message InviteTeamMemberRequest {
  string team_id = 1;
  string email = 2;
  string invited_by = 3;
}

message InviteTeamMemberResponse {
  string invitation_id = 1;
  string token = 2;
}

message AcceptTeamInvitationRequest {
  string token = 1;
  string user_id = 2;
}

message AcceptTeamInvitationResponse {
  bool success = 1;
  Team team = 2;
}

message ListTeamMembersRequest {
  string team_id = 1;
}

message ListTeamMembersResponse {
  repeated User members = 1;
  int32 total_count = 2;
}
